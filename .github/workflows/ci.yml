name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # content-client is published from the private Bastion repo, so reads need a
      # token with read:packages (the default GITHUB_TOKEN is scoped to this repo).
      GITHUB_ACTOR: jacobsandersen
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Test
        run: ./gradlew test
